spring:
  datasource:
    # H2 连接配置
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

    # HikariCP 连接池配置
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 连接池名称
      pool-name: H2-HikariPool

      # 连接池大小配置（H2内存库可以设小一点）
      maximum-pool-size: 10
      minimum-idle: 2

      # 超时配置
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

      # H2 特殊配置：连接测试查询（H2 不需要，但保留也不会报错）
      connection-test-query: SELECT 1
      validation-timeout: 5000

      # 连接泄漏检测（开发环境可以开启）
      leak-detection-threshold: 60000

      # 自动提交
      auto-commit: true

      # 连接时执行的初始化语句（H2 模拟 MySQL 模式）
      connection-init-sql: SET MODE MySQL

      # 注册 JMX（方便监控）
      register-mbeans: true

  h2:
    console:
      enabled: true
      path: /h2-console
    
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{spanId}] [%X{globalTxId}] [%X{transactionId}] %-5level %logger{36} - %msg%n"
# application.yml
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  prometheus:
    metrics:
      export:
        enabled: true
hazel.plugin.jdbc.enabled=true
hazel.plugin.jdbc.url=jdbc:h2:mem:testdb;MODE=MySQL
hazel.plugin.jdbc.driver=org.h2.Driver
hazel.plugin.jdbc.username=sa
hazel.plugin.jdbc.password=
hazel.plugin.jdbc.maxPoolSize=10
hazel.plugin.jdbc.minIdle=5
hazel.plugin.jdbc.initOnStart=true
hazel.plugin.jdbc.schema=schema.sql
hazel.plugin.jdbc.data=data.sql

hazel.plugin.web.enabled=true
hazel.plugin.web.port=8080
hazel.plugin.web.host=0.0.0.0
hazel.plugin.web.type=servlet

# H2 Console (Tomcat 10+ 使用 jakarta.servlet，H2 2.x 不支持，需禁用)
hazel.h2.console.enabled=false
hazel.h2.console.path=/h2-console

hazel.sql.init.mode=always
hazel.sql.init.schema-locations=classpath:schema.sql
hazel.sql.init.data-locations=classpath:data.sql

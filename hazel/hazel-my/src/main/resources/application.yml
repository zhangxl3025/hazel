hazel:
  plugin:
    jdbc:
      enabled: true
      url: jdbc:h2:mem:testdb;MODE=MySQL
      driver: org.h2.Driver
      username: sa
      password: ""
      maxPoolSize: 10
      minIdle: 5
      initOnStart: true
      schema: schema.sql
      data: data.sql

    web:
      enabled: true
      port: 8080
      host: 0.0.0.0


  h2:
    console:
      enabled: true
      path: /h2-console
    
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{spanId}] [%X{globalTxId}] [%X{transactionId}] %-5level %logger{36} - %msg%n"
# application.yml
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  prometheus:
    metrics:
      export:
        enabled: true